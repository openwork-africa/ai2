[package]
name = "ai2"
version.workspace = true
edition = "2021"
description = "Rates a coding agent's run: Modern Security Rating and Run Risk Factor"
license = "Apache-2.0"
repository = "https://github.com/openwork-africa/ai2"
readme = "README.md"

[lib]
name = "ai2"
path = "src/lib.rs"

[[bin]]
name = "ai2"
path = "src/main.rs"

[features]
default = ["harness", "vault", "setup", "apps", "agents", "ui", "mcp"]
harness = ["dep:harness", "mcp?/harness"]
vault = ["dep:vault", "dep:keys", "mcp?/vault"]
setup = ["dep:setup", "vault", "mcp?/setup"]
apps = ["dep:apps", "mcp?/apps"]
agents = ["dep:agents", "harness", "mcp?/agents"]
ui = ["dep:ui", "vault", "setup", "apps", "agents"]
mcp = ["dep:mcp", "ui?/mcp"]

[dependencies]
agents = { path = "crates/agents", optional = true }
anyhow = "1"
apps = { path = "crates/apps", optional = true }
harness = { path = "crates/harness", version = "0.1.0", optional = true }
keys = { path = "crates/keys", optional = true }
mcp = { path = "crates/mcp", default-features = false, optional = true }
setup = { path = "crates/setup", optional = true }
ui = { path = "crates/ui", optional = true }
vault = { path = "crates/vault", optional = true }
clap = { version = "4.6", features = ["derive", "env"] }
include_dir = "0.7"
os_info = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokei = "15"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
regex.workspace = true
tempfile.workspace = true

[workspace]
resolver = "3"
members = [".", "crates/agents", "crates/apps", "crates/harness", "crates/keys", "crates/mcp", "crates/setup", "crates/ui", "crates/vault"]

[workspace.package]
rust-version = "1.88"
edition = "2021"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
zeroize = "1"

[profile.release]
strip = true
lto = true
