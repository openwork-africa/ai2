[package]
name = "ai2"
version.workspace = true
edition = "2021"
description = "Rates a coding agent's run: Modern Security Rating and Run Risk Factor"
license = "Apache-2.0"
repository = "https://github.com/openwork-africa/ai2"
readme = "README.md"

[lib]
name = "ai2"
path = "src/lib.rs"

[[bin]]
name = "ai2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
harness = { path = "crates/harness", version = "0.1.0" }
keys = { path = "crates/keys" }
setup = { path = "crates/setup" }
vault = { path = "crates/vault" }
vault-ui = { path = "crates/vault-ui" }
clap = { version = "4.6", features = ["derive", "env"] }
include_dir = "0.7"
os_info = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokei = "15"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace]
members = [".", "crates/harness", "crates/keys", "crates/setup", "crates/vault", "crates/vault-ui"]

[workspace.package]
edition = "2021"
version = "0.1.2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
zeroize = "1"

[profile.release]
strip = true
lto = true
