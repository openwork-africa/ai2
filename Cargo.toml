[package]
name = "ai2"
version = "0.1.0"
edition = "2021"
description = "Rates a coding agent's run: Modern Security Rating, Run Risk Factor and Agent Malicious Intent"
license = "MIT"
repository = "https://github.com/openwork-africa/ai2"
readme = "README.md"

[lib]
name = "ai2"
path = "src/lib.rs"

[[bin]]
name = "ai2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
include_dir = "0.7"
os_info = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokei = "15"
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
lto = true
