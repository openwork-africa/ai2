[package]
name = "ui"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "ai2 in the browser: a local server on 127.0.0.1 for setup, apps, reviews and the vault"

[dependencies]
anyhow.workspace = true
apps = { path = "../apps" }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap.workspace = true
futures-util = { version = "0.3", default-features = false }
include_dir = "0.7"
mime_guess = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "sync", "fs", "io-util", "signal", "time"] }
tower-http = { version = "0.7", features = ["limit"] }
utoipa = "6"
utoipa-axum = "0.3"
vault = { path = "../vault" }

[dev-dependencies]
tempfile.workspace = true
