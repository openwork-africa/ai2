[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Every ai2 piece as MCP tools, over stdio and streamable HTTP, with an OpenAPI document made from the tool list"

[features]
default = ["harness", "vault", "setup"]
harness = ["dep:harness"]
vault = ["dep:vault"]
setup = ["dep:setup"]
apps = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
harness = { path = "../harness", features = ["schema"], optional = true }
rmcp = { version = "3.8", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
setup = { path = "../setup", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "sync"] }
vault = { path = "../vault", optional = true }
zeroize.workspace = true

[dev-dependencies]
rmcp = { version = "3.8", features = ["client"] }
tempfile.workspace = true
