name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  features:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - "--no-default-features"
          - "--no-default-features --features harness,vault"
          - "--no-default-features --features harness,vault,setup"
          - "--no-default-features --features apps"
          - "--no-default-features --features mcp"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings
      - run: cargo test ${{ matrix.features }}

  each-feature:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --each-feature --no-dev-deps

  ara-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: harness,vault has no setup, server or MCP crates
        run: |
          found=$(cargo tree --no-default-features --features harness,vault -e normal --prefix none | awk '{print $1}' | sort -u | grep -xE 'setup|apps|ui|mcp|axum|tokio|rmcp|utoipa-axum' || true)
          test -z "$found" || { echo "$found"; exit 1; }
      - name: harness,vault,setup has no server or MCP crates
        run: |
          found=$(cargo tree --no-default-features --features harness,vault,setup -e normal --prefix none | awk '{print $1}' | sort -u | grep -xE 'apps|ui|mcp|axum|tokio|rmcp|utoipa-axum' || true)
          test -z "$found" || { echo "$found"; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code -- ../dist
      - run: bun run lint
      - run: bun test
